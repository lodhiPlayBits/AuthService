# =====================================================
# Docker Compose for Auth Service
# =====================================================
# USAGE:
#   Local:      docker compose --env-file .env up -d --build
#   Production: docker compose --env-file .env.prod up -d --build
# =====================================================

version: '3.8'

services:
  # ===================================================
  # Auth Service
  # ===================================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TTL_SECOND: ${JWT_ACCESS_TTL_SECOND}
      JWT_REFRESH_TTL_SECOND: ${JWT_REFRESH_TTL_SECOND}
      
      # Cookie
      JWT_REFRESH_TOKEN_COOKIE_NAME: ${JWT_REFRESH_TOKEN_COOKIE_NAME}
      JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN}
      JWT_COOKIE_PATH: ${JWT_COOKIE_PATH}
      
      # HikariCP
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE}
      HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT}
      HIKARI_IDLE_TIMEOUT: ${HIKARI_IDLE_TIMEOUT}
      HIKARI_MAX_LIFETIME: ${HIKARI_MAX_LIFETIME}
      HIKARI_LEAK_DETECTION_THRESHOLD: ${HIKARI_LEAK_DETECTION_THRESHOLD}
      
      # Server
      SERVER_PORT: ${SERVER_PORT}
      SERVER_CONNECTION_TIMEOUT: ${SERVER_CONNECTION_TIMEOUT}
      
      # JPA
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL}
      
      # Actuator
      ACTUATOR_ENDPOINTS: ${ACTUATOR_ENDPOINTS}
      ACTUATOR_HEALTH_SHOW_DETAILS: ${ACTUATOR_HEALTH_SHOW_DETAILS}
      
      # Logging
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY}
      LOG_LEVEL_SPRING_WEB: ${LOG_LEVEL_SPRING_WEB}
      LOG_LEVEL_HIBERNATE: ${LOG_LEVEL_HIBERNATE}
      LOG_LEVEL_FLYWAY: ${LOG_LEVEL_FLYWAY}
      LOG_LEVEL_HIKARI: ${LOG_LEVEL_HIKARI}
      
      # Log file
      LOG_FILE: ${LOG_FILE}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/var/log/auth-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

