version: '3.8'

services:
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "5002:5002"
    env_file:
      - ../auth-service/.env
    environment:
      - SERVER_PORT=5002
      - KAFKA_BOOTSTRAP_SERVERS=kafka-node-1:19092,kafka-node-2:19092
      - REDIS_HOST=${REDIS_HOST:-redis-service}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://authvolt.fun}
    networks:
      - kafka-network
      - authnet
    restart: unless-stopped

networks:
  kafka-network:
    name: authvolt-kafka-network
    external: true
  authnet:
    external: true
