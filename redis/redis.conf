# =============================================================================
# Redis Production Configuration
# =============================================================================
# This configuration is optimized for production use with security,
# performance, and reliability best practices.
# =============================================================================

# --- Network Configuration ---
# Bind to all interfaces (safe when using Docker networks)
bind 0.0.0.0
port 6379

# Enable TCP keepalive to detect dead connections
tcp-keepalive 300

# Maximum number of client connections
maxclients 10000

# Timeout for idle clients (0 = disabled, recommended: 300-600 seconds)
timeout 300

# --- Security Configuration ---
# CRITICAL: Set a strong password (via environment variable)
# Generate with: openssl rand -base64 32
requirepass ${REDIS_PASSWORD}

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_$REDIS_PASSWORD"
rename-command DEBUG ""
rename-command SHUTDOWN "SHUTDOWN_$REDIS_PASSWORD"

# Protected mode (extra layer of security)
protected-mode yes

# --- Memory Management ---
# Maximum memory allocation (adjust based on your server capacity)
maxmemory 512mb

# Eviction policy: Least Recently Used for keys with TTL
# Options: volatile-lru, allkeys-lru, volatile-lfu, allkeys-lfu,
#          volatile-random, allkeys-random, volatile-ttl, noeviction
maxmemory-policy allkeys-lru

# Maximum samples for LRU and TTL algorithms
maxmemory-samples 5

# --- Persistence Configuration ---

## Append Only File (AOF) - Durability focused
appendonly yes
appendfilename "appendonly.aof"

# fsync policy: everysec provides good balance
# Options: always (slow, safest), everysec (good balance), no (fast, least safe)
appendfsync everysec

# Rewrite AOF when it grows by 100% and is at least 64MB
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Don't fsync during BGREWRITEAOF
no-appendfsync-on-rewrite no

# Load AOF at startup
aof-load-truncated yes

# Use mixed RDB+AOF format for faster restarts
aof-use-rdb-preamble yes

## RDB Snapshots - Backup strategy
# Save snapshots: <seconds> <changes>
save 900 1      # After 900 sec (15 min) if at least 1 key changed
save 300 10     # After 300 sec (5 min) if at least 10 keys changed
save 60 10000   # After 60 sec if at least 10000 keys changed

# Compress RDB files
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory (must exist and be writable)
dir /data

# Stop writes if snapshot fails (safety)
stop-writes-on-bgsave-error yes

# --- Logging Configuration ---
# Log levels: debug, verbose, notice, warning
loglevel notice

# Log to stdout (captured by Docker)
logfile ""

# Slow log configuration (log queries slower than X microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Replication Configuration ---
# Uncomment if this is a replica
# replicaof <master-ip> <master-port>
# masterauth <master-password>

# Replica serves stale data if master is down
replica-serve-stale-data yes

# Replica is read-only
replica-read-only yes

# Enable diskless replication for better performance
repl-diskless-sync yes
repl-diskless-sync-delay 5

# --- Performance Tuning ---
# Disable transparent huge pages (THP) warning
# Configure at OS level: echo never > /sys/kernel/mm/transparent_hugepage/enabled

# Lazy freeing (async deletion of keys)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Active defragmentation (requires Redis 4.0+)
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 20
active-defrag-cycle-min 1
active-defrag-cycle-max 25

# --- Client Output Buffer Limits ---
# Prevent slow clients from consuming too much memory
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Advanced Configuration ---
# Hash optimization
hash-max-listpack-entries 512
hash-max-listpack-value 64

# List optimization
list-max-listpack-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-listpack-entries 128
zset-max-listpack-value 64

# HyperLogLog optimization
hll-sparse-max-bytes 3000

# Streams configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# --- Notifications ---
# Keyspace notifications (disabled by default for performance)
# Enable if needed: "Ex" = expired keys events
# notify-keyspace-events ""

# --- Lua Scripting ---
# Lua script time limit (milliseconds, 0 = unlimited)
lua-time-limit 5000

# --- Cluster Configuration ---
# Uncomment if using Redis Cluster
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000

# --- Monitoring ---
# Latency monitoring threshold (milliseconds)
latency-monitor-threshold 100
