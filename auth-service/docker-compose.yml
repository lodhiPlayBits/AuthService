# =====================================================
# Docker Compose for Auth Service
# =====================================================
# USAGE:
#   Local:      docker compose --env-file .env up -d --build
#   Production: docker compose --env-file .env.prod up -d --build
# =====================================================

services:
  # ===================================================
  # Auth Service
  # ===================================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Admin Credentials
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PHONE: ${ADMIN_PHONE}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TTL_SECOND: ${JWT_ACCESS_TTL_SECOND}
      JWT_REFRESH_TTL_SECOND: ${JWT_REFRESH_TTL_SECOND}
      
      # Cookie
      JWT_REFRESH_TOKEN_COOKIE_NAME: ${JWT_REFRESH_TOKEN_COOKIE_NAME}
      JWT_COOKIE_HTTP_ONLY: ${JWT_COOKIE_HTTP_ONLY}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN}
      JWT_COOKIE_PATH: ${JWT_COOKIE_PATH}
      
      # HikariCP
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE}
      HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT}
      HIKARI_IDLE_TIMEOUT: ${HIKARI_IDLE_TIMEOUT}
      HIKARI_MAX_LIFETIME: ${HIKARI_MAX_LIFETIME}
      HIKARI_LEAK_DETECTION_THRESHOLD: ${HIKARI_LEAK_DETECTION_THRESHOLD}
      
      # Server
      SERVER_PORT: ${SERVER_PORT}
      SERVER_CONNECTION_TIMEOUT: ${SERVER_CONNECTION_TIMEOUT}
      
      # JPA
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL}
      
      # Actuator
      ACTUATOR_ENDPOINTS: ${ACTUATOR_ENDPOINTS}
      ACTUATOR_HEALTH_SHOW_DETAILS: ${ACTUATOR_HEALTH_SHOW_DETAILS}
      
      # Logging
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY}
      LOG_LEVEL_SPRING_WEB: ${LOG_LEVEL_SPRING_WEB}
      LOG_LEVEL_HIBERNATE: ${LOG_LEVEL_HIBERNATE}
      LOG_LEVEL_FLYWAY: ${LOG_LEVEL_FLYWAY}
      LOG_LEVEL_HIKARI: ${LOG_LEVEL_HIKARI}
      
      # Log file
      LOG_FILE: ${LOG_FILE}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis-service}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-60000}
      REDIS_POOL_MAX_ACTIVE: ${REDIS_POOL_MAX_ACTIVE:-8}
      REDIS_POOL_MAX_IDLE: ${REDIS_POOL_MAX_IDLE:-8}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-0}
      REDIS_POOL_MAX_WAIT: ${REDIS_POOL_MAX_WAIT:--1ms}
      REDIS_SHUTDOWN_TIMEOUT: ${REDIS_SHUTDOWN_TIMEOUT:-100ms}
      CACHE_TTL: ${CACHE_TTL:-3600000}

      # BCrypt Configuration
      BCRYPT_MAX_CONCURRENT: ${BCRYPT_MAX_CONCURRENT:-3}

      # Kafka Configuration
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-node-1:19092,kafka-node-2:19092}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-2}
    # Direct port access — uncomment for local dev without nginx
    # ports:
    #   - "5001:5001"
    expose:
      - "5001"
    volumes:
      - ./logs:/var/log/auth-service
    networks:
      - authnet
      - kafka-network
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 100% of 2 vCPUs (nginx/redis only use ~3%)
          memory: 4G       # 4GB (50% of total RAM)
        reservations:
          cpus: '1.0'      # Minimum 1 vCPU
          memory: 2G       # Minimum 2GB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  authnet:
    external: true
  kafka-network:
    name: authvolt-kafka-network
    external: true

