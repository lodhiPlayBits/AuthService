user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Lua package path — points at /usr/local/openresty/nginx/lua/
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;/usr/local/openresty/nginx/lua/lib/?.lua;;";

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';

    # Map status codes to cleanly separate 429 Too Many Requests logs
    map $status $is_429 {
        429     1;
        default 0;
    }

    map $status $is_not_429 {
        429     0;
        default 1;
    }

    access_log /dev/stdout main if=$is_not_429;
    access_log /usr/local/openresty/nginx/logs/429_rate_limit.log main if=$is_429;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Trust these headers for the real client IP only if you put a CDN
    # (e.g. Cloudflare) in front. Leave commented out otherwise —
    # trusting X-Forwarded-For from an untrusted source lets clients
    # spoof their own rate-limit bucket.
    # set_real_ip_from 0.0.0.0/0;
    # real_ip_header CF-Connecting-IP;

    include /usr/local/openresty/nginx/conf/conf.d/*.conf;
}