# --- Plain HTTP: ACME challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    server_name _;

    # Let's Encrypt / certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: actual gateway ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/yourdomain.com/privkey.pem;

    include /usr/local/openresty/nginx/ssl/ssl-params.conf;
    include /usr/local/openresty/nginx/conf/conf.d/security-headers.conf;

    limit_conn conn_limit 20;

    # ── Strict-limit, gateway-validated auth endpoints ───────────
    # login, register, refresh — these are the brute-force targets
    location ~ ^/api/v1/auth/(login|register|refresh) {
        limit_req zone=login_limit burst=5 nodelay;
        access_by_lua_file /usr/local/openresty/nginx/lua/validate_request.lua;
        proxy_pass http://auth_backend;
        include /usr/local/openresty/nginx/conf/conf.d/proxy-common.conf;
    }

    # ── General API ──────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        access_by_lua_file /usr/local/openresty/nginx/lua/validate_request.lua;
        proxy_pass http://auth_backend;
        include /usr/local/openresty/nginx/conf/conf.d/proxy-common.conf;
    }

    # ── Health check ─────────────────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://auth_backend/actuator/health;
    }

    # ── Gateway error page ───────────────────────────────────────
    location = /gateway-error.json {
        internal;
        default_type application/json;
        return 502 '{"error":"upstream_unavailable","message":"Auth service is temporarily unavailable."}';
    }
}