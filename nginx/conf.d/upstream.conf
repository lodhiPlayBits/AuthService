# One upstream block per service. Add a new block here when you add
# a new project to this gateway — do NOT merge services into one block.

upstream auth_backend {
    least_conn;
    server auth-service:8080 max_fails=3 fail_timeout=30s;
    # Add more lines here if you scale auth-service horizontally:
    # server auth-service-2:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

