# /home/ubuntu/backend/AuthService/nginx/conf.d/upstream.conf

# Auth service upstream - MOVED TO load-balancing.conf
# (Using the Docker container hostname instead)

# Single-instance services that do not require load balancing
upstream client_backend {
    server client-service:80 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream notification_backend {
    server notification-service:5002 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
