# /home/ubuntu/backend/AuthService/nginx/conf.d/load-balancing.conf

# Load Balancer for the Auth Service
# (Docker internal DNS resolves 'auth-service' to multiple IPs when scaled)
upstream auth_backend {
    least_conn; # Load balancing algorithm (sends traffic to the container with fewest active connections)
    server auth-service:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
