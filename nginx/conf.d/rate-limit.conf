# Exempt ALB and internal health-check IPs from rate limiting
geo $whitelist {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

map $whitelist $limit_ip {
    0 $binary_remote_addr;
    1 "";
}

# General API traffic
limit_req_zone $limit_ip zone=api_limit:10m rate=10r/s;

# Login/register/refresh — strict, brute-force / credential-stuffing protection
limit_req_zone $limit_ip zone=login_limit:10m rate=3r/s;

limit_req_status 429;

# Connection limiting — caps concurrent connections per IP, separate
# from request-rate limiting above. Protects against slow-loris style
# connection exhaustion.
limit_conn_zone $limit_ip zone=conn_limit:10m;
