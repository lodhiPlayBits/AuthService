# --- Plain HTTP: ACME challenge + redirect everything else to HTTPS ---
server {
    listen 80;
    server_name authvolt.fun;

    # Let's Encrypt / certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: actual gateway ---
server {
    listen 443 ssl;
    http2 on;
    server_name authvolt.fun;

    # ── TLS Certificates ─────────────────────────────────────────
    # These paths work with both:
    #   • Let's Encrypt certs (issued by certbot into the mounted volume)
    #   • Self-signed certs (generated by the entrypoint script)
    # Both use the same directory layout under /etc/nginx/ssl/live/<domain>/
    ssl_certificate     /etc/nginx/ssl/live/authvolt.fun/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/authvolt.fun/privkey.pem;

    # ── Hardened TLS parameters ──────────────────────────────────
    # Includes cipher suites, DH params, session config, OCSP stapling.
    # Switch to options-ssl-nginx.conf for Mozilla's Intermediate profile.
    include /usr/local/openresty/nginx/ssl/ssl-params.conf;

    # ── Security headers ─────────────────────────────────────────
    include /usr/local/openresty/nginx/conf/conf.d/security-headers.conf;

    # ── Connection limiting ──────────────────────────────────────
    limit_conn conn_limit 20;

    # ── Strict-limit, gateway-validated auth endpoints ───────────
    # login, register, refresh — these are the brute-force targets
    location ~ ^/api/v1/auth/(login|register|refresh) {
        limit_req zone=login_limit burst=5 nodelay;
        access_by_lua_file /usr/local/openresty/nginx/lua/validate_request.lua;
        proxy_pass http://auth_backend;
        include /usr/local/openresty/nginx/conf/conf.d/proxy-common.conf;
    }

    # ── Notification SSE Endpoint ────────────────────────────────
    # MUST come BEFORE general /api/v1/ to avoid Lua validation
    # ^~ modifier prevents regex matching and skips Lua validation
    location ^~ /api/v1/notifications/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://notification_backend;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE specific configurations
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        
        # Extended timeouts for SSE (24 hours)
        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Token rides in the query string — keep JWTs out of access logs.
        access_log off;
    }

    # ── WebSocket / STOMP Endpoint ───────────────────────────────
    # /ws/announcements carries the STOMP handshake (JWT via ?token= —
    # browsers cannot attach headers to WebSocket handshakes). Terminated
    # by notification-service, the single realtime delivery plane.
    # ^~ skips regex matching, and proxy-common.conf is NOT included
    # here: its "Connection: """ would break the upgrade handshake.
    location ^~ /ws/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://notification_backend;

        # WebSocket upgrade handshake
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Frames must flow through unbuffered
        proxy_buffering off;

        # Long-lived connections: STOMP heartbeats are 10s, but keep the
        # window generous for idle tabs (1 hour of silence allowed).
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Token rides in the query string — keep JWTs out of access logs.
        # Handshake accept/reject is logged by JwtHandshakeInterceptor.
        access_log off;
    }

    # ── General API ──────────────────────────────────────────────
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        access_by_lua_file /usr/local/openresty/nginx/lua/validate_request.lua;
        proxy_pass http://auth_backend;
        include /usr/local/openresty/nginx/conf/conf.d/proxy-common.conf;
    }

    # ── Health check ─────────────────────────────────────────────
    # No rate limit, no Lua, no auth. Load balancers / orchestrators
    # must always be able to reach this.
    location /health {
        access_log off;
        proxy_pass http://auth_backend/actuator/health;
    }

    # ── Gateway error page ───────────────────────────────────────
    # Internal-only — target of proxy_intercept_errors in proxy-common.conf
    location = /gateway-error.json {
        internal;
        default_type application/json;
        return 502 '{"error":"upstream_unavailable","message":"Auth service is temporarily unavailable."}';
    }

    location = / {
        return 301 /client/;
    }

    # ── Client service routes (separate file) ────────────────────
    include /usr/local/openresty/nginx/conf/conf.d/client-service.inc;
}
