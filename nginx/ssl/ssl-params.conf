# ═══════════════════════════════════════════════════════════════════
# ssl-params.conf — Hardened TLS parameters
# ═══════════════════════════════════════════════════════════════════
# Include this from any HTTPS server block:
#   include /usr/local/openresty/nginx/ssl/ssl-params.conf;
#
# Works with both self-signed and Let's Encrypt certificates.
# ═══════════════════════════════════════════════════════════════════

# ── Protocol versions ────────────────────────────────────────────
# TLS 1.2 is the floor; TLS 1.3 is preferred.  TLS 1.0 and 1.1 are
# disabled (deprecated by RFC 8996).
ssl_protocols TLSv1.2 TLSv1.3;

# ── Cipher suites ────────────────────────────────────────────────
# TLS 1.3 ciphers are configured automatically by OpenSSL; these
# only affect TLS 1.2.  Order: ECDHE > DHE, AES-GCM > CHACHA20.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;  # let the client pick (TLS 1.3 ignores this)

# ── DH parameters ────────────────────────────────────────────────
# Custom DH params for DHE cipher suites (generated by
# generate-self-signed.sh or manually with `openssl dhparam`).
ssl_dhparam /etc/nginx/ssl/dhparams.pem;

# ── Session caching ──────────────────────────────────────────────
# Shared cache avoids full handshakes on reconnections.
ssl_session_cache   shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;  # disable tickets — they break PFS if the
                          # ticket key is compromised

# ── OCSP stapling ────────────────────────────────────────────────
# Nginx fetches the OCSP response and staples it to the TLS
# handshake so the client doesn't have to contact the CA.
# Only works with certs that have an OCSP responder URL (i.e.
# Let's Encrypt). Self-signed certs silently skip this — no error.
ssl_stapling on;
ssl_stapling_verify on;

# Google + Cloudflare DNS resolvers for OCSP lookups.
resolver 8.8.8.8 1.1.1.1 valid=300s;
resolver_timeout 5s;

# ── Early data (0-RTT) ──────────────────────────────────────────
# Disabled — 0-RTT is vulnerable to replay attacks on non-idempotent
# endpoints (e.g. POST /login).  Enable only if you add anti-replay
# protection at the application level.
# ssl_early_data off;  # (off is the default)
