# ═══════════════════════════════════════════════════════════════════
# options-ssl-nginx.conf — Mozilla "Intermediate" TLS profile
# ═══════════════════════════════════════════════════════════════════
# Equivalent to the options-ssl-nginx.conf that certbot generates.
# Use this as a drop-in alternative to ssl-params.conf when you want
# a widely-tested, Mozilla-recommended configuration.
#
# Include from any HTTPS server block:
#   include /usr/local/openresty/nginx/ssl/options-ssl-nginx.conf;
#
# Source: https://ssl-config.mozilla.org/ (Intermediate, nginx)
# Generated: 2024-01-01  —  check the URL above for updates.
# ═══════════════════════════════════════════════════════════════════

ssl_protocols TLSv1.2 TLSv1.3;

ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:MozSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling
ssl_stapling on;
ssl_stapling_verify on;

# Replace with your own trusted CA if using a private CA
# ssl_trusted_certificate /etc/nginx/ssl/live/yourdomain.com/chain.pem;

resolver 8.8.8.8 1.1.1.1 valid=300s;
resolver_timeout 5s;

# HSTS — also set in security-headers.conf, but having it here
# ensures it's present even if security-headers.conf is removed.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
