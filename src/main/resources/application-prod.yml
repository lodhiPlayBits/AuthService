# Production configuration
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    database: POSTGRESQL
    show-sql: false  # ✅ Disabled in production
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

logging:
  level:
    root: INFO
    com.lodhi.auth: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN

security:
  jwt:
    secret: ${JWT_SECRET}  # ✅ Must be from environment
    issuer: ${JWT_ISSUER}
    access-ttl-second: ${JWT_ACCESS_TTL_SECOND:3600}
    refresh-ttl-second: ${JWT_REFRESH_TTL_SECOND:86400}
    refresh-cookie-name: ${JWT_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
    cookie-http-only: true
    cookie-secure: true  # ✅ HTTPS only in production
    cookie-same-site: strict  # ✅ Stricter in production
    cookie-domain: ${JWT_COOKIE_DOMAIN:}
