# =====================================================
# Spring Boot Application Configuration
# =====================================================
# Maven:  Loads .env via spring.config.import (below)
# Docker: .env is injected by Compose as container env vars;
#         spring.config.import is harmlessly skipped (optional:)
# =====================================================

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Auth-app
  
  # Graceful shutdown configuration
  lifecycle:
    timeout-per-shutdown-phase: 30s
  
  # Default transaction timeout
  transaction:
    default-timeout: 30s
  
  # Database configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:auth_service}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      pool-name: AuthServiceHikariPool
      auto-commit: true
      connection-test-query: SELECT 1
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
  
  # Flyway configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
  
  # JPA configuration
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        use_sql_comments: false
        # Query timeout settings
        jakarta.persistence.query.timeout: ${QUERY_TIMEOUT:10000}
        jakarta.persistence.lock.timeout: ${LOCK_TIMEOUT:5000}

# =====================================================
# Server Configuration
# =====================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:20s}
    threads:
      max: 200
      min-spare: 10
    accept-count: 100

# =====================================================
# Logging Configuration
# =====================================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.lodhi.auth: ${LOG_LEVEL_APP:INFO}
    com.lodhi.auth.security: ${LOG_LEVEL_SECURITY:DEBUG}
    com.lodhi.auth.audit: ${LOG_LEVEL_AUDIT:INFO}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:WARN}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:DEBUG}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:INFO}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/auth-service/auth-service.log}

# =====================================================
# Actuator Configuration
# =====================================================
management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
  health:
    db:
      enabled: true
    defaults:
      enabled: true

# =====================================================
# JWT & Security Configuration
# =====================================================
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-ttl-second: ${JWT_ACCESS_TTL_SECOND:3600}
    refresh-ttl-second: ${JWT_REFRESH_TTL_SECOND:86400}
    refresh-cookie-name: ${JWT_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:}
    cookie-path: ${JWT_COOKIE_PATH:/api/v1/auth}
