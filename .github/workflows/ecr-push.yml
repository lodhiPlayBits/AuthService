
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 117963306411.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  # Stage 1: Tests, lint and application builds
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            kind: maven
          - name: notification-service
            kind: maven
          - name: client
            kind: node

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.kind == 'maven'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            notification-contract/pom.xml
            ${{ matrix.name }}/pom.xml

      - name: Install notification-contract
        if: matrix.kind == 'maven'
        working-directory: notification-contract
        run: mvn -B -DskipTests install

      - name: Maven verify
        if: matrix.kind == 'maven'
        working-directory: ${{ matrix.name }}
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: matrix.kind == 'maven'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.name }}
          path: ${{ matrix.name }}/target/site/jacoco/
          retention-days: 30

      - name: Add coverage comment to PR
        if: matrix.kind == 'maven' && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ matrix.name }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: 'Code Coverage Report - ${{ matrix.name }}'

      - name: Generate coverage summary
        if: matrix.kind == 'maven' && always()
        run: |
          if [ -f "${{ matrix.name }}/target/site/jacoco/index.html" ]; then
            echo "## JaCoCo Coverage Report - ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Extract coverage percentage from JaCoCo report
            COVERAGE=$(grep -oP 'Total.*?(\d+)%' "${{ matrix.name }}/target/site/jacoco/index.html" | grep -oP '\d+' | head -1)
            if [ -n "$COVERAGE" ]; then
              echo "📊 **Overall Coverage:** ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 [View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Node
        if: matrix.kind == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install, lint, test and build
        if: matrix.kind == 'node'
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  # Stage 2: Filesystem security scans
  scan:
    name: scan (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        name: [auth-service, notification-service, client, kafka, nginx, redis]

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-fs.txt

      - name: Publish scan summary
        if: always()
        run: |
          {
            echo "## Trivy filesystem scan: ${{ matrix.name }}"
            echo '```'
            if [ -f trivy-fs.txt ]; then
              cat trivy-fs.txt
            else
              echo "No report generated."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Stage 3: SonarCloud analysis for auth-service
  sonar:
    name: sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install notification-contract
        run: mvn -B -DskipTests install -f notification-contract/pom.xml

      - name: Build and SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || {
            echo "SONAR_TOKEN repository secret is missing."
            exit 1
          }

          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -f auth-service/pom.xml \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=lodhiplaybits \
            -Dsonar.projectKey=lodhiPlayBits_AuthService

  # Stage 4: Build and scan images on PRs;
  # push images to ECR only after a branch push.
  build-push:
    name: build-push (${{ matrix.name }})
    needs: [test, scan]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            maven: true
          - name: notification-service
            maven: true
          - name: client
            maven: false
          - name: kafka
            maven: false
          - name: nginx
            maven: false
          - name: redis
            maven: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            notification-contract/pom.xml
            ${{ matrix.name }}/pom.xml

      - name: Install notification-contract
        if: matrix.maven
        working-directory: notification-contract
        run: mvn -B -DskipTests install

      - name: Package application
        if: matrix.maven
        working-directory: ${{ matrix.name }}
        run: mvn -B -DskipTests package

      - name: Set image tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TAG="pr-${{ github.event.number }}-${GITHUB_SHA::7}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ matrix.name }}:${{ steps.tag.outputs.tag }}" \
            "./${{ matrix.name }}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-image.txt

      - name: Publish image scan summary
        if: always()
        run: |
          {
            echo "## Trivy image scan: ${{ matrix.name }}"
            echo '```'
            if [ -f trivy-image.txt ]; then
              cat trivy-image.txt
            else
              echo "No report generated."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::117963306411:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_IMAGE="${{ matrix.name }}:${{ steps.tag.outputs.tag }}"
          REMOTE_IMAGE="${ECR_REGISTRY}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}"

          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"

  # Single required check for branch protection
  ci-passed:
    name: ci-passed
    if: always()
    needs: [test, scan, sonar, build-push]
    runs-on: ubuntu-latest

    steps:
      - name: Verify all stages passed
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          BUILD_RESULT: ${{ needs.build-push.result }}
        run: |
          set -euo pipefail

          for result in \
            "$TEST_RESULT" \
            "$SCAN_RESULT" \
            "$SONAR_RESULT" \
            "$BUILD_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "CI failed: a required stage finished with result: $result"
              exit 1
            fi
          done

          echo "All required CI stages passed."
