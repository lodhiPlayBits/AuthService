name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  # Stage 1: tests / lint
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            kind: maven
          - name: notification-service
            kind: maven
          - name: client
            kind: node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.kind == 'maven'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            notification-contract/pom.xml
            ${{ matrix.name }}/pom.xml

      - name: Install notification-contract
        if: matrix.kind == 'maven'
        working-directory: notification-contract
        run: mvn -B -DskipTests install

      - name: Maven verify
        if: matrix.kind == 'maven'
        working-directory: ${{ matrix.name }}
        run: mvn -B verify

      - name: Set up Node
        if: matrix.kind == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.name }}/package-lock.json

      - name: Install, lint, test and build
        if: matrix.kind == 'node'
        working-directory: ${{ matrix.name }}
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm test
          npm run build

  # Stage 2: Trivy filesystem scan
  scan:
    name: scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [auth-service, notification-service, client, kafka, nginx, redis]
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # report only; set to '1' to fail the build
          format: table
          output: trivy-fs.txt

      - name: Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy filesystem scan: ${{ matrix.name }}"
            echo '```'; cat trivy-fs.txt; echo '```'
          } >> $GITHUB_STEP_SUMMARY

  # Stage: SonarCloud analysis
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=lodhiplaybits \
            -Dsonar.projectKey=lodhiPlayBits_AuthService

  # Stage 3: build image, scan image, push to ECR
  build-push:
    name: build-push (${{ matrix.name }})
    needs: [test, scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            maven: true
          - name: notification-service
            maven: true
          - name: client
            maven: false
          - name: kafka
            maven: false
          - name: nginx
            maven: false
          - name: redis
            maven: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            notification-contract/pom.xml
            ${{ matrix.name }}/pom.xml

      - name: Install notification-contract
        if: matrix.maven
        working-directory: notification-contract
        run: mvn -B -DskipTests install

      - name: Package jar
        if: matrix.maven
        working-directory: ${{ matrix.name }}
        run: mvn -B -DskipTests package

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Docker build
        run: docker build -t ${{ matrix.name }}:${{ steps.tag.outputs.tag }} ./${{ matrix.name }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # report only; set to '1' to fail the build
          format: table
          output: trivy-image.txt

      - name: Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy image scan: ${{ matrix.name }}"
            echo '```'; cat trivy-image.txt; echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::117963306411:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0

      - name: Push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          docker tag ${{ matrix.name }}:${{ steps.tag.outputs.tag }} $IMAGE
          docker push $IMAGE

  # Single required check for branch protection
  ci-passed:
    if: always()
    needs: [test, scan, sonar, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any stage failed
        run: |
          test "${{ needs.test.result }}" = "success" && \
          test "${{ needs.scan.result }}" = "success" && \
          test "${{ needs.sonar.result }}" = "success" && \
          test "${{ needs.build-push.result }}" = "success"
