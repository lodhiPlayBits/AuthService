name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            maven: true
          - name: notification-service
            maven: true
          - name: client
            maven: false
          - name: kafka
            maven: false
          - name: nginx
            maven: false
          - name: redis
            maven: false
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # report only; set to '1' to fail the build

      - name: Set up Java
        if: matrix.maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            notification-contract/pom.xml
            ${{ matrix.name }}/pom.xml

      - name: Install notification-contract
        if: matrix.maven
        working-directory: notification-contract
        run: mvn -B -DskipTests install

      - name: Build and test
        if: matrix.maven
        working-directory: ${{ matrix.name }}
        run: mvn -B verify

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Docker build
        run: docker build -t ${{ matrix.name }}:${{ steps.tag.outputs.tag }} ./${{ matrix.name }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # report only; set to '1' to fail the build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::117963306411:role/GitHubActionsECRPushRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          docker tag ${{ matrix.name }}:${{ steps.tag.outputs.tag }} $IMAGE
          docker push $IMAGE
